# Paste this at api.slack.com/apps -> Create New App -> From a manifest
display_information:
  name: Role Brief Copilot
  description: Answers recruiter questions instantly from founder role briefs.
features:
  bot_user:
    display_name: Role Brief Copilot
    always_online: true
  app_home:
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  slash_commands:
    - command: /rolebrief
      description: Create a new role brief from a JD + intake notes
      should_escape: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - commands
      - channels:history
      - groups:history
      - im:history
      - im:write
      - reactions:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.im
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
